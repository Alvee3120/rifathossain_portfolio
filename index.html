<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tanvir Hossain Rifat | Managing Director, Shordindu</title>

    <meta
      name="description"
      content="Tanvir Hossain Rifat — Managing Director of Shordindu. Email, call or explore the Shordindu brand."
    />
    <meta name="author" content="Tanvir Hossain Rifat" />
    <meta name="theme-color" content="#0E3536" />
    <meta name="color-scheme" content="dark light" />

    <!-- Canonical: replace with your live URL -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta
      property="og:title"
      content="Tanvir Hossain Rifat | Managing Director, Shordindu"
    />
    <meta
      property="og:description"
      content="Connect with Tanvir Hossain Rifat — Managing Director of Shordindu."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/assets/profile.jpg"
    />
    <meta property="og:image:alt" content="Portrait of Tanvir Hossain Rifat" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tanvir Hossain Rifat | Managing Director, Shordindu"
    />
    <meta
      name="twitter:description"
      content="Connect with Tanvir Hossain Rifat — Managing Director of Shordindu."
    />
    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/assets/profile.jpg"
    />

    <!-- FAVICON: replace assets/favicon.png with your own -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/profile.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <link rel="stylesheet" href="css/style.css" />

    <!-- Keep the staggered reveal visible when JavaScript is unavailable -->
    <noscript
      ><style>
        .reveal {
          opacity: 1;
          transform: none;
          animation: none;
        }
      </style></noscript
    >

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tanvir Hossain Rifat",
        "jobTitle": "Managing Director",
        "worksFor": {
          "@type": "Organization",
          "name": "Shordindu",
          "url": "https://shordindu-info.netlify.app/"
        },
        "email": "mailto:rifat4111@gmail.com",
        "telephone": "+447717800830",
        "url": "https://YOUR-DOMAIN.com/"
      }
    </script>
  </head>
  <body>
    <main class="card">
      <!-- PHOTO: swap assets/profile.jpg with a portrait (portrait ratio works best) -->
      <div class="card__media">
        <img
          class="card__photo reveal reveal--1"
          src="assets/profile.jpg"
          alt="Portrait of Tanvir Hossain Rifat"
          width="720"
          height="900"
          decoding="async"
          fetchpriority="high"
        />
      </div>

      <div class="card__body">
        <header class="profile reveal reveal--2">
          <h1 class="profile__name">Tanvir Hossain Rifat</h1>
          <p class="profile__role">Managing Director, Shordindu</p>
        </header>

        <nav class="actions reveal reveal--3" aria-label="Contact actions">
          <div class="actions__col">
            <a
              class="actions__btn actions__btn--email"
              href="mailto:rifat4111@gmail.com"
              aria-label="Email Tanvir Hossain Rifat"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="5" width="18" height="14" rx="2.5" />
                <path d="m4 7.5 8 5.5 8-5.5" />
              </svg>
              <span>Email</span>
            </a>
            <a
              class="actions__detail"
              href="mailto:rifat4111@gmail.com"
              aria-label="Email rifat4111@gmail.com"
              >rifat4111@gmail.com</a
            >
          </div>

          <div class="actions__col">
            <a
              class="actions__btn actions__btn--call"
              href="tel:+447717800830"
              aria-label="Call Tanvir Hossain Rifat"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M6.4 3.5h2.9l1.5 3.9-1.9 1.4a12.2 12.2 0 0 0 5.8 5.8l1.4-1.9 3.9 1.5v2.9a2 2 0 0 1-2.2 2A16.6 16.6 0 0 1 4.4 5.7a2 2 0 0 1 2-2.2Z"
                />
              </svg>
              <span>Call</span>
            </a>
            <a
              class="actions__detail"
              href="tel:+447717800830"
              aria-label="Call +447717800830"
              >+447717800830</a
            >
          </div>
        </nav>

        <!-- BRAND BANNER: the whole banner links to the Shordindu site -->
        <a
          class="brand-card reveal reveal--4"
          href="https://shordindu-info.netlify.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit the Shordindu website"
        >
          <span class="brand-card__badge">
            <!-- LOGO: swap assets/logo.png (amber tint assumes a single-colour mark) -->
            <img
              class="brand-card__logo"
              src="assets/logo.png"
              alt="Shordindu logo"
              width="30"
              height="34"
            />
          </span>

          <span class="brand-card__text">
            <span class="brand-card__title">SHORDINDU</span>
            <span class="brand-card__cta">Explore the brand</span>
          </span>

          <span class="brand-card__arrow" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h13" />
              <path d="m12.5 5.5 6.5 6.5-6.5 6.5" />
            </svg>
          </span>
        </a>

        <footer class="footer reveal reveal--5">
          <p class="footer__text">Connect with Tanvir</p>
        </footer>
      </div>
    </main>

    <!-- Recolours the flat logo to the exact brand amber. Remove if you supply a full-colour logo. -->
    <svg
      class="svg-defs"
      aria-hidden="true"
      focusable="false"
      width="0"
      height="0"
    >
      <filter id="brandify" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0 0 0 0 0.9333  0 0 0 0 0.6392  0 0 0 0 0.2784  0 0 0 1 0"
        />
      </filter>
    </svg>

    <script src="js/script.js" defer></script>
  </body>
</html>
