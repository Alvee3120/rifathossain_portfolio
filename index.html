    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="css/style.css" />

    <!-- Keep the staggered reveal visible when JavaScript is unavailable -->
    <noscript
      ><style>
        .reveal {
          opacity: 1;
          transform: none;
          animation: none;
        }
      </style></noscript
    >

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Tanvir Hossain Rifat",
        "jobTitle": "Managing Director",
        "worksFor": {
          "@type": "Organization",
          "name": "Shordindu",
          "url": "https://shordindu-info.netlify.app/"
        },
        "email": "mailto:rifat4111@gmail.com",
        "telephone": "+447717800830",
        "url": "https://YOUR-DOMAIN.com/"
      }
    </script>
  </head>
  <body>
    <main class="card">
      <!-- PORTRAIT + organic curve. PHOTO: swap assets/profile.jpg -->
      <div class="card__media reveal reveal--1">
        <span class="card__band card__band--teal" aria-hidden="true"></span>
        <span class="card__band card__band--gold" aria-hidden="true"></span>
        <img
          class="card__photo"
          src="assets/profile.jpg"
          alt="Portrait of Tanvir Hossain Rifat"
          width="720"
          height="900"
          decoding="async"
          fetchpriority="high"
        />
      </div>

      <div class="card__body">
        <header class="identity reveal reveal--2">
          <h1 class="identity__name">
            <span class="identity__first">Tanvir Hossain</span
            ><span class="identity__last">Rifat</span>
          </h1>
          <p class="identity__role">Managing Director, Shordindu</p>
        </header>

        <nav class="actions reveal reveal--3" aria-label="Contact actions">
          <a
            class="actions__btn actions__btn--primary"
            href="mailto:rifat4111@gmail.com"
            aria-label="Email Tanvir Hossain Rifat"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2.5" />
              <path d="m4 7.5 8 5.5 8-5.5" />
            </svg>
            <span>Email Me</span>
          </a>

          <a
            class="actions__btn actions__btn--secondary"
            href="tel:+447717800830"
            aria-label="Call Tanvir Hossain Rifat"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M6.4 3.5h2.9l1.5 3.9-1.9 1.4a12.2 12.2 0 0 0 5.8 5.8l1.4-1.9 3.9 1.5v2.9a2 2 0 0 1-2.2 2A16.6 16.6 0 0 1 4.4 5.7a2 2 0 0 1 2-2.2Z"
              />
            </svg>
            <span>Call Now</span>
          </a>
        </nav>

        <!-- FEATURED SHORDINDU CARD: the whole card links to the site -->
        <a
          class="feature reveal reveal--4"
          href="https://shordindu-info.netlify.app/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit the Shordindu website"
        >
          <svg
            class="feature__decor"
            viewBox="0 0 320 120"
            preserveAspectRatio="none"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M-8 118C70 104 118 60 138 2" />
            <path d="M328 14C266 28 224 62 204 110" />
          </svg>

          <span class="feature__badge">
            <!-- LOGO: swap assets/logo.png (amber tint assumes a single-colour mark) -->
            <img
              class="feature__logo"
              src="assets/logo.png"
              alt="Shordindu logo"
              width="30"
              height="34"
            />
          </span>

          <span class="feature__text">
            <span class="feature__title">Shordindu</span>
            <span class="feature__label">Explore the brand</span>
          </span>

          <span class="feature__arrow" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h13" />
              <path d="m12.5 5.5 6.5 6.5-6.5 6.5" />
            </svg>
          </span>
        </a>
      </div>
    </main>

    <!-- Recolours the flat logo to the brand gold. Remove if you supply a full-colour logo. -->
    <svg
      class="svg-defs"
      aria-hidden="true"
      focusable="false"
      width="0"
      height="0"
    >
      <filter id="brandify" color-interpolation-filters="sRGB">
        <feColorMatrix
          type="matrix"
          values="0 0 0 0 0.9333  0 0 0 0 0.6392  0 0 0 0 0.2784  0 0 0 1 0"
        />
      </filter>
    </svg>

    <script src="js/script.js" defer></script>
